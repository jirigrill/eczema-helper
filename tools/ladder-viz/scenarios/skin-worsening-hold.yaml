# Skin-worsening hold (#523 scenario 5). Climb a rung with a stable baseline
# skin reading, then a worse reading within the stability window holds the climb
# (hold · skin-worsening) even though cadence would otherwise allow advancing.
# The skin then settles back down and climbing resumes.
allergen: eggs
phase: reintroduction
stage: breastfed

days:
  - date: 2026-06-01
    events:
      - meal: portion # rung 1
      - skin: 1 # steady non-zero baseline — not itself a hold reason
  - date: 2026-06-02
    events:
      - skin: 2 # worsened 1→2 within the window → skin-worsening hold
  - date: 2026-06-03
    events: []
  - date: 2026-06-04
    events:
      - skin: 0 # skin settles back → climbing resumes
  - date: 2026-06-05
    events: []
