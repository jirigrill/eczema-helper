# Reaction → walk-down → re-confirm in place (#523 scenario 2, reshaped by #501).
# Climb all three rungs cleanly, then a mild-reaction eval at the TOP rung walks
# the ladder DOWN one rung: the reacting rung is capped forever (never
# re-climbed) and the run rests on the stepped-down rung. Once the rest window
# passes, that stepped-down rung is re-confirmed IN PLACE by its own dwell — the
# run never climbs back onto the rung that reacted — until the dwell completes
# and the rung settles. The distinct walk-down path: climbing → resting →
# dwelling → settled, ending BELOW the rung that reacted.
allergen: eggs
phase: reintroduction
stage: breastfed

days:
  - date: 2026-06-01
    events:
      - meal: portion # climb rung 1 (eggs-1)
  - date: 2026-06-02
    events: [] # probe cadence elapsed → climbing
  - date: 2026-06-03
    events:
      - meal: portion # climb rung 2 (eggs-2)
  - date: 2026-06-04
    events: [] # climbing
  - date: 2026-06-05
    events:
      - meal: package # climb rung 3 (eggs-3, the top)
  - date: 2026-06-06
    events:
      - eval: mild-reaction # reaction at the top → walk down to rung 2, cap rung 3
  - date: 2026-06-07
    events: [] # rest window (mild = 3d) open → resting
  - date: 2026-06-08
    events: []
  - date: 2026-06-09
    events: [] # rest ends (06-06 + 3 = 06-09)
  - date: 2026-06-10
    events: [] # re-confirm the stepped-down rung in place → dwelling
  - date: 2026-06-11
    events:
      - meal: portion # dwell dose 1 on rung 2 (never re-climbs to rung 3)
  - date: 2026-06-12
    events: []
  - date: 2026-06-13
    events: [] # dwelling
  - date: 2026-06-14
    events:
      - meal: portion # dwell dose 2 (confirm cadence)
  - date: 2026-06-15
    events: []
  - date: 2026-06-16
    events: [] # dwelling
  - date: 2026-06-17
    events:
      - meal: portion # dwell dose 3 → dwell count reaches the ladder length
  - date: 2026-06-18
    events: []
  - date: 2026-06-19
    events: []
  - date: 2026-06-20
    events: [] # latency since the last dose elapses → settled
