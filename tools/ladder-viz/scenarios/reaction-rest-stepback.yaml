# Reaction → rest → step-back → re-climb (#523 scenario 2). Climb two rungs
# cleanly, then a mild-reaction eval at the current rung opens a rest window;
# once the window passes the run steps back to the prior rung; a clean re-dose
# and tolerated eval there reopen the climb.
allergen: eggs
phase: reintroduction
stage: breastfed

days:
  - date: 2026-06-01
    events:
      - meal: portion # rung 1
  - date: 2026-06-02
    events: []
  - date: 2026-06-03
    events:
      - meal: portion # rung 2
  - date: 2026-06-04
    events:
      - eval: mild-reaction # reaction at rung 2 → rest
  - date: 2026-06-05
    events: []
  - date: 2026-06-06
    events: []
  - date: 2026-06-07
    events: []
  - date: 2026-06-08
    events: [] # rest window elapses → stepped back to rung 1
  - date: 2026-06-09
    events: []
  - date: 2026-06-10
    events: []
  - date: 2026-06-11
    events: []
  - date: 2026-06-12
    events:
      - meal: portion # re-dose the stepped-back rung
  - date: 2026-06-13
    events: []
  - date: 2026-06-14
    events:
      - eval: tolerated # clean verdict resolves the setback → re-climb
