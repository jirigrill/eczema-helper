# Reaction → rest → step-back → re-climb (#523 scenario 2). Climb two rungs
# cleanly, then a mild-reaction eval at the current rung opens a rest window;
# once the window passes the run steps back to the prior rung; a clean re-dose
# and tolerated eval there resolve the setback. The climb then genuinely re-opens
# and continues: a fresh dose carries it back up to the rung that reacted, and
# once the confirm cadence elapses the run ends in `climbing`, ready to advance
# past that rung — not merely re-entering `climbing` at the step-back floor.
allergen: eggs
phase: reintroduction
stage: breastfed

days:
  - date: 2026-06-01
    events:
      - meal: portion # rung 1
  - date: 2026-06-02
    events: []
  - date: 2026-06-03
    events:
      - meal: portion # rung 2
  - date: 2026-06-04
    events:
      - eval: mild-reaction # reaction at rung 2 → rest
  - date: 2026-06-05
    events: []
  - date: 2026-06-06
    events: []
  - date: 2026-06-07
    events: []
  - date: 2026-06-08
    events: [] # rest window elapses → stepped back to rung 1
  - date: 2026-06-09
    events: []
  - date: 2026-06-10
    events: []
  - date: 2026-06-11
    events: []
  - date: 2026-06-12
    events:
      - meal: portion # re-dose the stepped-back rung
  - date: 2026-06-13
    events: []
  - date: 2026-06-14
    events:
      - eval: tolerated # clean verdict resolves the setback
  - date: 2026-06-15
    events: [] # confirm cadence elapses → climb re-opens
  - date: 2026-06-16
    events:
      - meal: portion # re-climb carries back up to the rung that reacted
  - date: 2026-06-17
    events: []
  - date: 2026-06-18
    events: []
  - date: 2026-06-19
    events: [] # cadence elapses again → ends in climbing, ready to advance past it
