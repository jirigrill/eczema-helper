# Clean climb → settled (#523 scenario 1). No reactions: doses climb every rung
# at cadence-respecting intervals, reach the top rung, and the top rung is
# re-dosed until the dwell confirmation completes → settled. The top-rung doses
# are spaced one day past the confirm cadence, so a dwell day surfaces between
# them (cadence elapsed, dwell not yet complete → dwelling) before the run
# settles — the run walks climbing → dwelling → settled, not straight to settled.
# A couple of skin readings show that channel coexisting with a clean run.
allergen: eggs
phase: reintroduction
stage: breastfed

days:
  - date: 2026-06-01
    events:
      - meal: portion # rung 1
      - skin: 0
  - date: 2026-06-02
    events: []
  - date: 2026-06-03
    events:
      - meal: portion # rung 2
  - date: 2026-06-04
    events: []
  - date: 2026-06-05
    events:
      - meal: package # top rung — dwell dose 1
      - skin: 0
  - date: 2026-06-06
    events: []
  - date: 2026-06-07
    events: []
  - date: 2026-06-08
    events: [] # cadence elapsed, dwell not yet complete → dwelling
  - date: 2026-06-09
    events:
      - meal: package # dwell dose 2 (confirm cadence)
  - date: 2026-06-10
    events: []
  - date: 2026-06-11
    events: []
  - date: 2026-06-12
    events: [] # dwelling again while the confirmation runs
  - date: 2026-06-13
    events:
      - meal: package # dwell dose 3 → dwell count reaches the ladder length
  - date: 2026-06-14
    events: []
  - date: 2026-06-15
    events: []
  - date: 2026-06-16
    events: [] # latency since the last top dose elapses → settled
