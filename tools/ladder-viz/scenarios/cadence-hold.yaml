    events:
      - meal: portion # rung 1 — opens the cadence window
  - date: 2026-06-02
    events: []
  - date: 2026-06-03
    events:
      - meal: portion # rung 2
  - date: 2026-06-04
    events:
      - meal: portion # logged inside the window → hold (cadence)
  - date: 2026-06-05
    events: []
  - date: 2026-06-06
    events: [] # window elapsed, skin stable → climbing resumes
