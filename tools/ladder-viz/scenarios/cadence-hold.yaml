# Cadence hold (#523 scenario 6). A dose is logged, then a second dose lands
# inside the cadence window before it has elapsed → hold (cadence) even though
# nothing else blocks advancing. Once the window elapses with skin stable and no
# reaction, the hold lifts and climbing resumes.
allergen: eggs
phase: reintroduction
stage: breastfed

days:
