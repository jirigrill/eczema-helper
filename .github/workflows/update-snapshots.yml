name: Update Playwright Snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Generate & PR snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Sync SvelteKit types
        run: bunx svelte-kit sync

      - name: Generate snapshots
        run: bunx playwright test --update-snapshots || true

      - name: Open PR with updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="test/update-playwright-snapshots-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git add "tests/e2e/"
          git diff --staged --quiet && echo "No snapshot changes, exiting." && exit 0
          git commit -m "test: update playwright snapshots"
          git push origin "$branch"
          gh pr create \
            --title "test: update playwright snapshots" \
            --body "Auto-generated by the **Update Playwright Snapshots** workflow. Regenerated all \`*-chromium-linux.png\` baselines on Ubuntu + Chromium." \
            --base main \
            --head "$branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
