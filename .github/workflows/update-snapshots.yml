name: Update Playwright Snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Generate & commit snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Sync SvelteKit types
        run: bunx svelte-kit sync

      - name: Generate snapshots
        run: bunx playwright test --update-snapshots || true

      - name: Commit & push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "tests/e2e/"
          git diff --staged --quiet && echo "No snapshot changes, exiting." && exit 0
          git commit -m "test: update playwright snapshots"
          git push origin HEAD:${{ github.ref_name }}
